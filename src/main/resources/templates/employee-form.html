<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle}">Employee Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 40px; color: #222; }
        .card { max-width: 520px; margin: auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        h1 { margin: 0 0 20px; color: #1e3a5f; }
        label { display: block; font-size: 14px; color: #555; margin: 12px 0 6px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .buttons { display: flex; gap: 8px; margin-top: 22px; }
        button, a.btn { padding: 10px 18px; border: none; border-radius: 6px; background: #1e3a5f; color: #fff; cursor: pointer; text-decoration: none; font-size: 14px; }
        a.btn { background: #888; }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${formTitle}">Employee</h1>

    <!-- th:object links the form to the employee; th:field fills each box with its value -->
    <form th:action="@{${formAction}}" th:object="${employee}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Job Title</label>
        <input type="text" th:field="*{jobTitle}" required>

        <label>Department</label>
        <input type="text" th:field="*{department}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required>

        <div class="buttons">
            <button type="submit">Save</button>
            <a class="btn" th:href="@{/employees}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
